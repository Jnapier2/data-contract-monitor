name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  security-events: write
  packages: read
  contents: read

jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4
