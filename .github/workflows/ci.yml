name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Use source-mode identity during development CI
        run: python -c "from pathlib import Path; Path('RELEASE_MODE').unlink(missing_ok=True)"
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-test.lock
          python -m pip install --no-deps -e .
      - name: Compile Python
        run: python -m compileall -q src tools tests
      - name: Verify project consolidation
        run: python tools/project_index.py --root . --check-only
      - name: Lint the bundled native contract
        run: data-contract-monitor contract lint --contract examples/contracts/customer_orders.yml
      - name: Run tests with resource warnings promoted
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m pytest
      - name: Run passing streaming demonstration
        run: |
          python examples/generate_demo_data.py
          data-contract-monitor validate --contract examples/contracts/customer_orders.yml --data examples/data/customer_orders_good_generated.csv --execution-mode streaming --output-dir reports/streaming-smoke --no-history
      - name: Confirm failing demonstration returns contract-failure code
        shell: bash
        run: |
          set +e
          data-contract-monitor demo --scenario bad --output-dir reports/ci-bad
          code=$?
          set -e
          test "$code" -eq 2
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: evidence-${{ matrix.os }}-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend toolchain
        working-directory: frontend
        run: npm ci
      - name: Compile TypeScript
        working-directory: frontend
        run: npm run build
      - name: Verify packaged TypeScript dashboard logic is synchronized
        run: cmp frontend/dist/app.js src/data_contract_monitor/web/app.js
