name: Build release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -r requirements-test.lock
          python -m pip install --no-deps -e .
      - name: Verify source and generated contracts
        run: |
          python -c "from pathlib import Path; Path('RELEASE_MODE').unlink(missing_ok=True)"
          python tools/project_index.py --root . --check-only
          python tools/generate_schemas.py
          python -m compileall -q src tools tests
          PYTHONWARNINGS=error::ResourceWarning python -m pytest
          data-contract-monitor contract lint --contract examples/contracts/customer_orders.yml
      - name: Record release-scale benchmark
        run: python tools/benchmark.py --rows 100000 --trials 1 --execution-mode streaming --output BENCHMARK_RESULTS_RELEASE_CI.json
      - name: Build exact release ZIP
        run: python tools/build_release.py --source-root . --output-dir dist
      - uses: actions/upload-artifact@v6
        with:
          name: data-contract-monitor-release
          path: dist/
